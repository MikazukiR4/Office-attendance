<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance PDF preview</title>
    <style>
      html,
      body,
      #pdf-viewer {
        width: 100%;
        height: 100%;
        min-height: 760px;
        margin: 0;
      }

      body {
        overflow: hidden;
      }

      #viewer-error {
        padding: 1rem;
        color: #b42318;
        font: 14px sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="pdf-viewer"></div>
    <div id="viewer-error" role="alert" hidden></div>
    <script type="module">
      import EmbedPDF from "https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js";

      const pdfUrl = new URLSearchParams(window.location.search).get("src");
      const viewerTarget = document.getElementById("pdf-viewer");
      const errorTarget = document.getElementById("viewer-error");

      if (!pdfUrl || !pdfUrl.startsWith("/app/static/preview/preview_")) {
        errorTarget.textContent = "ไม่พบไฟล์ PDF สำหรับแสดงตัวอย่าง";
        errorTarget.hidden = false;
      } else {
        try {
          EmbedPDF.init({
            type: "container",
            target: viewerTarget,
            src: pdfUrl,
          });
        } catch (error) {
          errorTarget.textContent = `เปิดตัวอย่าง PDF ไม่สำเร็จ: ${error.message}`;
          errorTarget.hidden = false;
        }
      }
    </script>
  </body>
</html>
